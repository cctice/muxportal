[package]
name = "muxportal"
version = "0.1.0"
description = "Termius with tmux — SSH client with native tmux session management"
authors = ["MuxPortal Contributors"]
edition = "2021"

[lib]
name = "muxportal_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ssh2 = "0.9"
portable-pty = "0.8"
chrono = "0.4"
