name: Build Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '26.1.10909125'

      - name: Install system deps for openssl build
        run: sudo apt-get update && sudo apt-get install -y perl make pkg-config

      - name: Set Android NDK env
        run: |
          NDK_HOME=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          echo "CC_aarch64_linux_android=${NDK_HOME}/bin/aarch64-linux-android33-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=${NDK_HOME}/bin/aarch64-linux-android33-clang++" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_HOME}/bin/aarch64-linux-android33-clang" >> $GITHUB_ENV
          echo "OPENSSL_NO_VENDOR=" >> $GITHUB_ENV

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install frontend dependencies
        run: npm install

      - name: Add Android SDK to PATH
        run: echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Build Android APK
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MuxPortal ${{ github.ref_name }}'
          releaseBody: 'See the [CHANGELOG](https://github.com/cctice/muxportal/blob/main/CHANGELOG.md) for details.'
          releaseDraft: false
          prerelease: false
          args: '--target aarch64-linux-android'
